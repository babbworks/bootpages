# Bootpages behind nginx.
#
#   sudo cp bootpages.nginx.conf /etc/nginx/sites-available/bootpages
#   sudo ln -s /etc/nginx/sites-available/bootpages /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Substitute the two names below for your own. They are written here as
# page.babb.tel and edit.page.babb.tel.
#
# ---------------------------------------------------------------------------
# TWO NAMES, AND THE REASON IS NOT COSMETIC
#
# bootpages serves the editor and published pages on different ports, and
# docs/decisions.md explains why: the editor keeps author tokens in browser
# storage, published pages are untrusted content, and same-origin policy is
# what stops a script in the second reading the first.
#
# An origin is scheme + host + port. Once nginx terminates TLS, the ports
# are gone from the browser's view - so the SEPARATION NOW LIVES ENTIRELY
# IN THESE TWO server_name VALUES. Serve both under one name on different
# paths and you have merged two origins the whole design keeps apart, and
# nothing will appear to break until someone publishes a hostile page.
#
# bootpages cannot detect this mistake. config.py compares the addresses it
# binds to, which stay distinct on 8080 and 8081 no matter what nginx does
# in front. It will report a healthy two-origin configuration and be wrong.
#
# So: two server blocks, two names, and never a shared one.
# ---------------------------------------------------------------------------
#
# Caddy is not an option on a PowerBook G4. Go has never targeted 32-bit
# powerpc - only ppc64 and ppc64le - which also rules out cloudflared,
# Tailscale and frp if you were considering a tunnel.

# Rate limiting, because the upstream is a 2004 laptop.
#
# ThreadingHTTPServer spawns a thread per connection and SQLite takes one
# writer at a time. Neither degrades gracefully. These zones are generous
# for a human and ungenerous for a script; the point is a ceiling, not a
# gate.
limit_req_zone $binary_remote_addr zone=pages_read:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=editor_write:10m rate=5r/s;

# Handshakes are the most expensive thing this machine does, so resumption
# matters more here than on ordinary hardware. Shared across both blocks.
ssl_session_cache shared:BOOTPAGES:10m;
ssl_session_timeout 1d;
ssl_session_tickets on;

# --------------------------------------------------------------- redirect

server {
    listen 80;
    listen [::]:80;
    server_name page.babb.tel edit.page.babb.tel;

    # Leave room for HTTP-01 if you ever fall back to it. With DNS-01 this
    # location is unused and harmless.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------ published pages
#
# The untrusted origin. Anything an author publishes is served from here,
# and nothing of the editor's is.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # `http2 on;` needs nginx 1.25.1 or later. The target runs forky/sid
    # with 1.30.4, so this is the correct form there. On an older nginx
    # (bookworm ships 1.22.1) this is an unknown directive and nginx -t
    # fails - use `listen 443 ssl http2;` instead on those.
    http2 on;

    server_name page.babb.tel;

    ssl_certificate     /etc/letsencrypt/live/page.babb.tel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/page.babb.tel/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # ChaCha20 first, deliberately, and server order enforced to get it.
    #
    # The usual modern advice is to let the client choose. That assumes the
    # server has AES-NI. A G4 does not - it has AltiVec, which OpenSSL uses
    # far less effectively - so AES-GCM is materially more expensive here
    # than ChaCha20-Poly1305. This is one of the few places where the
    # hardware should overrule the convention.
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_conf_command Ciphersuites TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;

    # No OCSP stapling, deliberately.
    #
    # Let's Encrypt no longer publishes an OCSP responder URL in its
    # certificates, having moved to CRLs. `ssl_stapling on` is therefore a
    # no-op that warns on every start and reload:
    #
    #   "ssl_stapling" ignored, no OCSP responder URL in the certificate
    #
    # A warning nobody can act on is worse than no warning, because it
    # trains you to skim past the ones that matter.

    # Covers edit.page.babb.tel too, since it is below this name.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # NOTE: no Content-Security-Policy here. server.py sets PAGE_CSP on the
    # pages role and a different policy on the editor. Adding one at this
    # layer would send two, and the browser enforces the intersection -
    # which is how a policy tightens by accident and breaks a page nobody
    # touched.

    # Text compresses enormously and the CPU is weak, so compress cheaply.
    # Level 1 gets most of the ratio for a fraction of the work; the
    # defaults would spend G4 cycles chasing the last few percent.
    gzip on;
    gzip_comp_level 1;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_vary on;

    # Published pages are small; this is a ceiling, not a budget.
    client_max_body_size 1m;

    # Served by nginx, never by Python. A stylesheet has no business
    # occupying one of the upstream's threads.
    location /static/ {
        alias /opt/bootpages/bootpages/static/;
        expires 1h;
        access_log off;
    }

    location / {
        limit_req zone=pages_read burst=40 nodelay;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering on, emphatically. It lets nginx absorb slow clients so
        # a reader on a bad connection occupies nginx memory rather than
        # one of the upstream's threads. Thread-per-connection is the other
        # way this machine falls over.
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # The upstream is loopback on the same box. If it has not answered
        # in ten seconds it is wedged, not busy.
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

# -------------------------------------------------------------- the editor
#
# The trusted origin. This is where author tokens live, so it gets the
# tighter rate limit and none of the published content.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # `http2 on;` needs nginx 1.25.1 or later. The target runs forky/sid
    # with 1.30.4, so this is the correct form there. On an older nginx
    # (bookworm ships 1.22.1) this is an unknown directive and nginx -t
    # fails - use `listen 443 ssl http2;` instead on those.
    http2 on;

    server_name edit.page.babb.tel;

    # A wildcard is single-label: *.babb.tel does NOT match
    # edit.page.babb.tel. Either issue *.page.babb.tel as well, or name
    # both hosts explicitly on one certificate.
    ssl_certificate     /etc/letsencrypt/live/page.babb.tel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/page.babb.tel/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_conf_command Ciphersuites TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;

    # No OCSP stapling, deliberately.
    #
    # Let's Encrypt no longer publishes an OCSP responder URL in its
    # certificates, having moved to CRLs. `ssl_stapling on` is therefore a
    # no-op that warns on every start and reload:
    #
    #   "ssl_stapling" ignored, no OCSP responder URL in the certificate
    #
    # A warning nobody can act on is worse than no warning, because it
    # trains you to skim past the ones that matter.

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 1;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_vary on;

    # Page content is posted here, so this needs more headroom than the
    # pages origin.
    client_max_body_size 4m;

    location /static/ {
        alias /opt/bootpages/bootpages/static/;
        expires 1h;
        access_log off;
    }

    location / {
        limit_req zone=editor_write burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
