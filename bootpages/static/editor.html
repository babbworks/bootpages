<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootpages</title>

<!--
  The editor.

  Ultra simple on purpose: a title, a byline, and a column of blocks. The
  only chrome is a plus in the left margin of whichever block has focus,
  which opens the list of things a block can be.

  No framework, no build step, no dependencies. A block is a textarea, the
  document is an array, and publishing is one POST. When capability pages
  arrive, the block menu is where a site's declared modules appear - it is
  already a list built from data rather than hardcoded markup.
-->

<style>
  :root {
    /* Declared so the system colours the browser picks - form controls,
       scrollbars, and anything using Canvas - follow the same scheme the
       custom properties below do. Without this, a dark-mode browser gave
       the menu light grey text on a white Canvas: the media query moved
       half the pair and left the other half behind. */
    color-scheme: light dark;

    --ink: #111;
    --bg: #fff;
    --faint: #8a8a8a;
    --line: #e4e4e4;
    --accent: #2b6cb0;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ececec;
      --bg: #141414;
      --faint: #8a8a8a;
      --line: #2e2e2e;
      --accent: #7fb3e8;
    }
  }

  body { background: var(--bg); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--serif);
    color: var(--ink);
    line-height: 1.6;
  }

  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 12rem 1.5rem;
  }

  /* Every field is a textarea that grows, so nothing ever scrolls inside
     itself and the page reads as one continuous document. */
  textarea {
    display: block;
    width: 100%;
    border: 0;
    padding: 0;
    margin: 0;
    resize: none;
    overflow: hidden;
    background: transparent;
    color: inherit;
    font: inherit;
    line-height: inherit;
  }

  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--faint); }

  #title textarea { font-size: 2.4rem; line-height: 1.2; font-weight: 700; }
  #byline textarea { font-family: var(--sans); font-size: .95rem; color: var(--faint); }
  #byline { margin: .75rem 0 2.5rem 0; }

  /* --- blocks ------------------------------------------------------- */

  .block { position: relative; margin: 0 0 1.1rem 0; }

  /* The left margin affordance. Present only on the block with focus, so
     the page is otherwise completely bare. */
  .plus {
    position: absolute;
    left: -2.25rem;
    top: -0.1rem;
    width: 1.7rem;
    height: 1.7rem;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: transparent;
    color: var(--faint);
    font: 1.1rem/1 var(--sans);
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s;
  }

  .block:focus-within .plus, .block:hover .plus { opacity: 1; }
  .plus:hover { color: var(--ink); border-color: var(--faint); }

  .block[data-type="h3"] textarea { font-size: 1.5rem; font-weight: 700; }
  .block[data-type="h4"] textarea { font-size: 1.15rem; font-weight: 700; }

  .block[data-type="blockquote"] {
    border-left: 3px solid var(--line);
    padding-left: 1rem;
    font-style: italic;
  }

  .block[data-type="pre"] textarea {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .9rem;
    background: rgba(128, 128, 128, .08);
    padding: .8rem 1rem;
    border-radius: 4px;
  }

  .block[data-type="li"] textarea { padding-left: 1.2rem; }
  .block[data-type="li"]::before {
    content: "•";
    position: absolute;
    left: .25rem;
    color: var(--faint);
  }

  .block[data-type="img"] textarea,
  .block[data-type="table"] textarea {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .85rem;
    color: var(--accent);
  }

  .block[data-type="hr"] { border-top: 1px solid var(--line); margin: 2rem 0; }
  .block[data-type="hr"] textarea { display: none; }

  /* --- menu --------------------------------------------------------- */

  #menu {
    position: absolute;
    z-index: 10;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .12);
    padding: .35rem;
    font-family: var(--sans);
    font-size: .9rem;
    min-width: 13rem;
  }

  #menu[hidden] { display: none; }

  #menu button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: .45rem .6rem;
    border-radius: 4px;
    cursor: pointer;
  }

  #menu button:hover { background: rgba(128, 128, 128, .13); }
  #menu small { color: var(--faint); margin-left: .4rem; }
  #menu button:hover small { color: var(--ink); }

  /* --- bar ---------------------------------------------------------- */

  #bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    gap: 1rem;
    align-items: center;
    padding: .8rem 1.5rem;
    border-top: 1px solid var(--line);
    background: var(--bg);
    font-family: var(--sans);
    font-size: .9rem;
  }

  #bar button {
    font: inherit;
    padding: .45rem 1.1rem;
    border-radius: 5px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }

  #bar button.quiet { background: transparent; color: var(--accent); }
  #bar .right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
  #status { color: var(--faint); }
  #status a { color: var(--accent); }

  /* The current identity is visible at all times rather than hidden in a
     menu. Publishing is permanent - a page written under the wrong account
     keeps that byline forever, and there is no unpublish. */
  #who {
    font: inherit;
    padding: .45rem .9rem;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }

  /* --- overlays ------------------------------------------------------ */

  #veil {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .35);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    z-index: 50;
  }

  #veil[hidden], #sheet[hidden] { display: none; }

  .card {
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.75rem;
    max-width: 27rem;
    width: 100%;
    font-family: var(--sans);
    font-size: .95rem;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
  }

  .card h2 { margin: 0 0 .5rem 0; font-size: 1.3rem; font-family: var(--serif); }
  .card p { margin: 0 0 1.1rem 0; color: var(--faint); line-height: 1.5; }
  .card p.plain { color: var(--ink); }

  .card label { display: block; margin: 0 0 .9rem 0; }
  .card label span { display: block; margin-bottom: .25rem; font-size: .85rem; }
  .card label small { color: var(--faint); font-weight: normal; }

  .card input[type=text] {
    width: 100%;
    font: inherit;
    padding: .5rem .6rem;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: transparent;
    color: var(--ink);
  }

  .card .row { display: flex; gap: .6rem; margin-top: 1.2rem; }

  .card button {
    font: inherit;
    padding: .55rem 1rem;
    border-radius: 5px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    flex: 1;
  }

  .card button.quiet { background: transparent; color: var(--accent); }
  .card button.link {
    border: 0; background: transparent; color: var(--faint);
    flex: 0; padding: .55rem 0; text-decoration: underline;
  }

  .token {
    font: .85rem/1.5 ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all;
    background: rgba(128, 128, 128, .12);
    border-radius: 5px;
    padding: .7rem .8rem;
    margin: 0 0 1rem 0;
    color: var(--ink);
  }

  .warn {
    border-left: 3px solid #c0392b;
    padding-left: .8rem;
    color: var(--ink);
  }

  .check { display: flex; gap: .5rem; align-items: flex-start; margin: 0 0 .5rem 0; }
  .check input { margin-top: .25rem; }
  .check span { font-size: .85rem; color: var(--faint); line-height: 1.45; }

  /* --- sheets, rising from the bar ----------------------------------- */

  #sheet {
    position: fixed;
    left: 0; right: 0; bottom: 3.2rem;
    z-index: 40;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--bg);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .14);
    font-family: var(--sans);
    font-size: .9rem;
  }

  #sheet .inner { max-width: 40rem; margin: 0 auto; padding: 1.25rem 1.5rem; }
  #sheet h3 { margin: 0 0 .8rem 0; font-size: 1rem; }

  .item {
    display: flex; gap: .75rem; align-items: baseline;
    padding: .55rem 0;
    border-top: 1px solid var(--line);
  }

  .item .grow { flex: 1; min-width: 0; }
  .item .grow b { font-weight: 600; }
  .item .grow small { display: block; color: var(--faint); }
  .item button {
    font: inherit; font-size: .85rem;
    border: 1px solid var(--line); background: transparent; color: var(--accent);
    border-radius: 4px; padding: .25rem .6rem; cursor: pointer;
  }
  .item.current { background: rgba(128, 128, 128, .07); }
</style>

<main>
  <div id="title"></div>
  <div id="byline"></div>
  <div id="blocks"></div>
</main>

<div id="menu" hidden></div>

<div id="sheet" hidden></div>

<div id="bar">
  <button id="publish">Publish</button>
  <button id="new" class="quiet">New</button>
  <span id="status"></span>
  <span class="right">
    <button id="pages" class="quiet">Pages</button>
    <button id="who">no account</button>
  </span>
</div>

<div id="veil" hidden><div class="card" id="card"></div></div>

<script>
// The block vocabulary. Only core tags for now - this renderer implements
// no modules, so everything here maps straight onto something Telegraph
// would also accept. When capability pages arrive, a site's declared
// modules get appended to this list at runtime.
const TYPES = [
  {type: "p",          label: "Text",       hint: "plain paragraph"},
  {type: "h3",         label: "Heading"},
  {type: "h4",         label: "Subheading"},
  {type: "blockquote", label: "Quote"},
  {type: "pre",        label: "Code"},
  {type: "li",         label: "List item"},
  {type: "img",        label: "Image",      hint: "paste a URL"},
  {type: "table",      label: "Table",      hint: "paste from a spreadsheet"},
  {type: "hr",         label: "Divider"},
];

const PLACEHOLDER = {
  p: "Write something…",
  h3: "Heading",
  h4: "Subheading",
  blockquote: "Quote",
  pre: "Code",
  li: "List item",
  img: "https://example.org/photo.jpg",
  table: "Paste tab-separated rows, or type them with tabs",
  hr: "",
};

const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------- accounts
//
// The browser holds a list of tokens. They have NO server-side association
// with each other - the store cannot tell that two of them are yours, and
// there is no endpoint that would let it. This is a privacy property, not
// just a convenience, and it rests on one rule:
//
//   ONE TOKEN PER REQUEST, EVER.
//
// Never send two together, never build a call that accepts several. The
// moment the client correlates them the property is gone retroactively,
// for every account already created.

const REMEMBERED = "bootpages.accounts";

const state = {
  instance: null,   // what getInstanceInfo said
  accounts: [],     // {token, short_name, author_name, remembered}
  current: 0,
  path: null,       // the page being edited, if any
};

function loadAccounts() {
  try {
    const saved = JSON.parse(localStorage.getItem(REMEMBERED) || "[]");
    state.accounts = saved.map((a) => ({...a, remembered: true}));
  } catch (problem) {
    state.accounts = [];
  }
}

// Only remembered accounts are written back. An account the author chose
// not to remember lives in memory and disappears when the tab does.
function saveAccounts() {
  const keep = state.accounts
    .filter((a) => a.remembered)
    .map(({token, short_name, author_name}) => ({token, short_name, author_name}));

  localStorage.setItem(REMEMBERED, JSON.stringify(keep));
}

function account() {
  return state.accounts[state.current] || null;
}

function addAccount(entry, remembered) {
  state.accounts.push({...entry, remembered});
  state.current = state.accounts.length - 1;
  saveAccounts();
  paintBar();
}

// -------------------------------------------------------------- publish

async function publish() {
  const who = account();
  if (!who) return welcome();

  const status = $("status");
  status.textContent = "publishing…";

  try {
    const params = {
      access_token: who.token,          // one token, never a list
      title: titleField.value || "Untitled",
      author_name: bylineField.value || who.author_name || "",
      content: JSON.stringify(toNodes()),
    };

    const page = state.path
      ? await call("editPage", {...params, path: state.path})
      : await call("createPage", params);

    state.path = page.path;
    history.replaceState(null, "", "/?edit=" + page.path);

    // The link points at the pages origin, which the server decides - the
    // editor never guesses where a page lives.
    status.innerHTML =
      `<a href="${escapeHtml(page.url)}" target="_blank">${escapeHtml(page.path)}</a>` +
      ` · revision ${page.revision} · ${escapeHtml(page.digest.slice(0, 18))}…`;

  } catch (problem) {
    status.textContent = explain(problem);
  }
}

async function load(path) {
  const page = await call("getPage", {path, return_content: "true"});

  state.path = page.path;
  titleField.value = page.title;
  bylineField.value = page.author_name || "";
  grow(titleField);
  grow(bylineField);
  fromNodes(page.content || []);

  history.replaceState(null, "", "/?edit=" + page.path);
  $("status").innerHTML =
    `<a href="${escapeHtml(page.url)}" target="_blank">${escapeHtml(page.path)}</a>` +
    ` · revision ${page.revision}`;
}

$("publish").onclick = publish;
$("new").onclick = () => { location.href = "/"; };
$("pages").onclick = () =>
  ($("sheet").hidden ? pagesSheet() : closeSheet());
$("who").onclick = () =>
  ($("sheet").hidden ? accountsSheet() : closeSheet());

// A click anywhere else closes whatever is open. The veil is deliberately
// not dismissable this way - the first-run card has nothing behind it yet.
document.addEventListener("click", (event) => {
  if (!event.target.closest("#sheet") && !event.target.closest("#bar")) {
    closeSheet();
  }
});

// ------------------------------------------------------------------ boot

function ready() {
  paintBar();

  const editing = new URLSearchParams(location.search).get("edit");

  if (editing && !state.path) {
    load(editing).catch((problem) => {
      $("status").textContent = explain(problem);
      if (!$("blocks").children.length) makeBlock("p");
    });
  } else if (!$("blocks").children.length) {
    makeBlock("p");
    titleField.focus();
  }
}

async function boot() {
  try {
    // Asked before anything is drawn. The instance decides what the first
    // screen offers - this file does not know whether accounts can be
    // created here until it is told.
    state.instance = await call("getInstanceInfo", {});
  } catch (problem) {
    state.instance = {name: "Bootpages", description: "", mode: "admin", contact: ""};
  }

  document.title = state.instance.name;

  loadAccounts();
  paintBar();

  if (!state.accounts.length) {
    welcome();
  } else {
    ready();
  }
}

boot();
</script>
